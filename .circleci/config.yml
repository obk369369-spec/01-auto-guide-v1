version: 2.1

jobs:
  validate-tool1:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Verify required Tool 1 files
          command: |
            test -s index.html
            test -s guide_template.html
      - run:
          name: Block synthetic TOC fallback
          command: |
            if grep -n "firstNormalized\.toc = defaultToc" index.html; then
              echo "FAIL: synthetic TOC fallback is still active. Missing source TOC must remain HOLD/empty."
              exit 1
            fi
      - run:
          name: Block sample TOC generators and templates
          command: |
            if grep -n "function defaultToc" index.html; then
              echo "FAIL: defaultToc synthetic generator remains in production code."
              exit 1
            fi
            if grep -n "var TOC_TEMPLATE" index.html; then
              echo "FAIL: fixed TOC_TEMPLATE remains in production code. Source TOC must be verified."
              exit 1
            fi
      - run:
          name: Block synthetic report catalog and placeholder links
          command: |
            if grep -n "function publisherCatalog" index.html; then
              echo "FAIL: hard-coded publisherCatalog remains in production code."
              exit 1
            fi
            if grep -n "example\.com/" index.html; then
              echo "FAIL: example.com placeholder report link remains in production code."
              exit 1
            fi
      - run:
          name: Confirm real result path exists
          command: |
            grep -n "await fetch(endpoint" index.html
            grep -n "if (!rawResults.length) throw new Error('결과 없음')" index.html

workflows:
  tool1-external-validation:
    jobs:
      - validate-tool1
