(function(){

  function setStatus(msg){ if(statusEl) statusEl.textContent = msg; }

  function stamp(){ return new Date().toLocaleTimeString(&#x27;ko-KR&#x27;,{hour12:false}); }
  function log(el,msg){ if(!el) return; el.textContent += `[${stamp()}] ${msg}\n`; el.scrollTop = el.scrollHeight; }
  function hashText(s){ let h=0; for(let i=0;i&lt;s.length;i++){ h=((h&lt;&lt;5)-h)+s.charCodeAt(i); h|=0; } return &#x27;h&#x27;+Math.abs(h); }
  function norm(s){ return (s||&#x27;&#x27;).replace(/\s+/g,&#x27; &#x27;).trim(); }
  function getText(el){ return norm(el?.innerText || el?.textContent || el?.value || &#x27;&#x27;); }
  function cssPath(el){
    if(!el || !el.tagName) return &#x27;&#x27;;
    const parts=[]; let cur=el;
    while(cur &amp;&amp; cur.nodeType===1 &amp;&amp; parts.length&lt;5){
      let part=cur.tagName.toLowerCase();
      if(cur.id){ part += &#x27;#&#x27;+cur.id; parts.unshift(part); break; }
      const cls=(cur.className||&#x27;&#x27;).toString().trim().split(/\s+/).filter(Boolean).slice(0,2);
      if(cls.length) part += &#x27;.&#x27;+cls.join(&#x27;.&#x27;);
      const parent=cur.parentElement;
      if(parent){ const sib=[...parent.children].filter(n=&gt;n.tagName===cur.tagName); if(sib.length&gt;1) part += `:nth-of-type(${sib.indexOf(cur)+1})`; }
      parts.unshift(part); cur=parent;
    }
    return parts.join(&#x27; &gt; &#x27;);
  }
  function clearHighlights(doc){ doc.querySelectorAll(&#x27;.coord-hit&#x27;).forEach(n=&gt;n.classList.remove(&#x27;coord-hit&#x27;)); }

  function renderTraceViews(){
    if(clickedTraceView) clickedTraceView.value = safeJson(clickedTrace);
    if(firstFailView) firstFailView.value = safeJson(firstFail);
  }
  function saveClickedTrace(trace){
    clickedTrace = trace;
    try{ localStorage.setItem(&#x27;wic_clicked_trace&#x27;, JSON.stringify(trace)); }catch(e){}
    renderTraceViews();
  }
  function restoreClickedTrace(){
    try{
      const raw = localStorage.getItem(&#x27;wic_clicked_trace&#x27;);

    }catch(e){ clickedTrace = null; }
    renderTraceViews();

  function tocDepth(line){

  function buildTocGroups(lines){

  function balanceTocColumns(lines){
    const groups=buildTocGroups(lines);
    if(lines.length&lt;=6) return {left:lines, right:[], mode:&#x27;single&#x27;};
    const total=lines.length;
    const target=Math.ceil(total/2);
    let left=[], right=[], leftCount=0;
    groups.forEach((g,idx)=&gt;{
      const remainGroups=groups.length-idx;
      if(leftCount &lt; target || remainGroups===groups.length){ left=left.concat(g.lines); leftCount+=g.lines.length; }
      else right=right.concat(g.lines);
    });
    if(right.length===0 &amp;&amp; groups.length&gt;1){
      right=groups.pop().lines;
      left=groups.flatMap(g=&gt;g.lines);
    }
    if(Math.abs(left.length-right.length) &gt; Math.ceil(total*0.35) &amp;&amp; groups.length&gt;=3){
      left=[]; right=[]; leftCount=0;
      groups.forEach(g=&gt;{
        if(leftCount + g.lines.length &lt;= target || left.length===0){ left=left.concat(g.lines); leftCount+=g.lines.length; }
        else right=right.concat(g.lines);
      });
    }
    return {left,right,mode:&#x27;balanced_group&#x27;};

      traceStep(&#x27;STEP1&#x27;, &#x27;payload=&#x27; + JSON.stringify(payload));

      const res = await fetch(endpoint, {

  function scoreGuide(r) {

    set(&#x27;p6LockState&#x27;, (hasCore &amp;&amp; p5)?&#x27;PASS&#x27;:&#x27;HOLD&#x27;, (hasCore &amp;&amp; p5)?&#x27;p6-pass&#x27;:&#x27;p6-hold&#x27;);
    set(&#x27;p6OnlineState&#x27;, onlineDefaultHold?&#x27;미사용 고정 PASS&#x27;:&#x27;FAIL&#x27;, onlineDefaultHold?&#x27;p6-pass&#x27;:&#x27;p6-fail&#x27;);
    set(&#x27;p6FreeSlot&#x27;, freeSlot?&#x27;PASS&#x27;:&#x27;HOLD&#x27;, freeSlot?&#x27;p6-pass&#x27;:&#x27;p6-hold&#x27;);
    set(&#x27;p6CacheSlot&#x27;, cacheSlot?&#x27;PASS&#x27;:&#x27;HOLD&#x27;, cacheSlot?&#x27;p6-pass&#x27;:&#x27;p6-hold&#x27;);
    set(&#x27;p6RepeatBlock&#x27;, repeatBlocked?&#x27;PASS / 동일 입력 재실행 차단&#x27;:&#x27;대기 / 최초 입력&#x27;, repeatBlocked?&#x27;p6-pass&#x27;:&#x27;p6-hold&#x27;);
    set(&#x27;p6FailIsolation&#x27;, &#x27;PASS / FAIL 발생 시 HOLD 격리&#x27;, &#x27;p6-pass&#x27;);
    var finalPass=hasCore &amp;&amp; p5 &amp;&amp; onlineDefaultHold &amp;&amp; freeSlot &amp;&amp; cacheSlot;
    set(&#x27;p6FinalJudge&#x27;, finalPass?&#x27;P6 PASS 후보 / 안정성 체크 완료&#x27;:&#x27;P6 HOLD / 구조 확인 필요&#x27;, finalPass?&#x27;p6-pass&#x27;:&#x27;p6-hold&#x27;);
    var reason=$(&#x27;p6FinalReason&#x27;);
    if(reason){

    }

    var diag=$(&#x27;diagPacket&#x27;);

      diag.value=&#x27;[P6_FINAL_STABILITY_PACKET]\nENGINE=&#x27;+ENGINE+&#x27;\nBASE_LOCK=P1~P5_NO_RETEST\nONLINE_FETCH=OFF_DEFAULT\nFREE_SLOT=PUBLIC_HTML_PASTE_FILE_ONLY\nCACHE_SLOT=REUSE_FIRST\nHOLD_SLOT=LOGIN_CAPTCHA_DYNAMIC_BLOCK_PRIVATE_PDF\nERROR_HASH=&#x27;+h+&#x27;\nREPEAT_COUNT=&#x27;+repeatedCount+&#x27;\nFINAL=&#x27;+(finalPass?&#x27;PASS_CANDIDATE&#x27;:&#x27;HOLD&#x27;);
    }

  }
  function bind(){

&lt;script id=&quot;dq-quality-layer-v6-left-text-engine&quot;&gt;
(function(){
  var ENGINE=&#x27;DQ_QUALITY_LAYER_V6_LEFT_TEXT_TO_PUBLIC_SCOPE_HOLD&#x27;;

  ];
  function $(id,doc){return (doc||document).getElementById(id)}

  function esc(s){return String(s||&#x27;&#x27;).replace(/[&amp;&lt;&gt;]/g,function(c){return {&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;}[c]})}
  function rightDoc(){var f=$(&#x27;rightFrame&#x27;); return f ? (f.contentDocument||f.contentWindow.document) : null}
  function setRight(id,text){var d=rightDoc(), e=d&amp;&amp;$(id,d); if(e){e.textContent=text||&#x27;&#x27;}}
  function norm(s){return String(s||&#x27;&#x27;).replace(/\s+/g,&#x27; &#x27;).trim()}
  function keywords(){
    var raw=[val(&#x27;customerRaw&#x27;),val(&#x27;researchField&#x27;),val(&#x27;interestField&#x27;),val(&#x27;duty&#x27;),val(&#x27;publisherMemo&#x27;)].join(&#x27; &#x27;);

  function sectorKo(){return norm(val(&#x27;researchField&#x27;)||val(&#x27;interestField&#x27;)||val(&#x27;duty&#x27;)||&#x27;관련 시장&#x27;)}
  function sectorEn(){

    if(/멤브레인|membrane/.test(s)) return &#x27;Membrane&#x27;;
    if(/탄소|carbon/.test(s)) return &#x27;Carbon&#x27;;
    if(/ai|인공지능/.test(s)) return &#x27;Artificial Intelligence&#x27;;
    if(/반도체|semiconductor/.test(s)) return &#x27;Semiconductor&#x27;;
    if(/배터리|전지|battery/.test(s)) return &#x27;Battery&#x27;;
    return sectorKo();
  }
  function searchUrl(v){return &#x27;https://www.google.com/search?q=&#x27;+encodeURIComponent(&#x27;site:&#x27;+v.domain+&#x27; &#x27;+keywords()+&#x27; market report&#x27;)}
  function makeCards(){
    var y=new Date().getFullYear();
    var ko=sectorKo(), en=sectorEn();

        reason:&#x27;단독 HTML은 온라인 페이지를 직접 긁지 못함(CORS/동적페이지/로그인 가능성). 이 단계는 왼쪽 텍스트로 발행사별 공개 후보 경로를 만들고, 실제 원문 확인 전에는 PASS 금지.&#x27;
      }
    })
  }
  function ensurePanel(){
    var left=q(&#x27;.left&#x27;); if(!left) return null;
    var old=$(&#x27;P6_DQ3_ONLINE_PANEL&#x27;); if(old) old.style.display=&#x27;none&#x27;;
    var p=$(&#x27;dqQualityLayerV6&#x27;); if(p) return p;
    p=document.createElement(&#x27;div&#x27;); p.id=&#x27;dqQualityLayerV6&#x27;;
    p.innerHTML=&#x27;&lt;h3&gt;DATA_QUALITY 판단 레이어 V6&lt;/h3&gt;&lt;div&gt;&lt;b&gt;입력 방식:&lt;/b&gt; 왼쪽 텍스트만 사용 / URL 직접 입력 아님&lt;/div&gt;&lt;div&gt;&lt;b&gt;판정:&lt;/b&gt; 공개 원문 확인 전 PASS 금지, 부족값은 HOLD 유지&lt;/div&gt;&lt;div id=&quot;dqv6Status&quot; class=&quot;dqv6-mini&quot;&gt;대기&lt;/div&gt;&lt;div id=&quot;dqv6Cards&quot;&gt;&lt;/div&gt;&#x27;;

    return p;
  }
  function applyCard(c){

    var a=rightDoc()&amp;&amp;$(&#x27;guideLinkAnchor&#x27;,rightDoc()); if(a){a.href=c.link; a.textContent=&#x27;공개 후보 확인&#x27;;}
    var b=$(&#x27;bridgeStatus&#x27;); if(b)b.textContent=&#x27;DATA_QUALITY V6 반영: &#x27;+c.publisher+&#x27; / &#x27;+c.status;

    var box=$(&#x27;dqv6Cards&#x27;); if(!box)return;

    var flow=$(&#x27;flowTrace&#x27;); if(flow) flow.textContent=&#x27;[TRACE]\n&#x27;+ENGINE+&#x27;\nLEFT_TEXT_TO_VENDOR_SEARCH: PASS\nPUBLIC_DATA_CONFIRMED: HOLD\nRIGHT_GUIDE_SYNC: HOLD_VALUES_VISIBLE\nRULE: 실제 공개 원문 확인 전 PASS 금지&#x27;;
