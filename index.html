  function buildTocGroups(lines){

  function balanceTocColumns(lines){
    const groups=buildTocGroups(lines);
    if(lines.length<=6) return {left:lines, right:[], mode:'single'};
    const total=lines.length;
    const target=Math.ceil(total/2);
    let left=[], right=[], leftCount=0;
    groups.forEach((g,idx)=>{
      const remainGroups=groups.length-idx;
      if(leftCount < target || remainGroups===groups.length){ left=left.concat(g.lines); leftCount+=g.lines.length; }
      else right=right.concat(g.lines);
    });
    if(right.length===0 && groups.length>1){
      right=groups.pop().lines;
      left=groups.flatMap(g=>g.lines);
    }
    if(Math.abs(left.length-right.length) > Math.ceil(total*0.35) && groups.length>=3){
      left=[]; right=[]; leftCount=0;
      groups.forEach(g=>{
        if(leftCount + g.lines.length <= target || left.length===0){ left=left.concat(g.lines); leftCount+=g.lines.length; }
        else right=right.concat(g.lines);
      });
    }
    return {left,right,mode:'balanced_group'};

<script id="singlePathDiagnosticsV1">
(function(){
  'use strict';

  const MID_IDS = ['midTitleEn','midTitleKo','bookPub','bookDate','bookPage','bookListPrice','bookSupplyPrice','midLink','midToc'];
  const RIGHT_IDS = ['guideTitleEn','guideTitleKo','guidePub','guideDate','guidePage','guideListPrice','guideSupplyPrice','guideLinkAnchor','guideLinkText','guideTocLeft','guideToc'+'Right'];
  const MUTATION_IDS = ['guidePub','guideDate','guidePage','guideListPrice','guideSupplyPrice','guideLinkAnchor','guideLinkText','guideTocLeft','guideToc'+'Right'];
  const STORE = {
    clickedTrace: null,
    firstFail: null,
    targetProbe: null,
    diagPacket: null,
    mutationLog: [],
    coordMode: false,
    observerReady: false
  };

  function $(id, root){ return (root || document).getElementById(id); }
  function val(id){ const el=$(id); return el ? (el.value || '').trim() : ''; }
  function txt(el){
    if(!el) return '';
    if(el.tagName && el.tagName.toLowerCase() === 'a') return (el.textContent || '').trim() + ' | href=' + (el.getAttribute('href') || '');
    return ((el.value !== undefined ? el.value : el.textContent) || '').trim();
  }
  function write(id, data){
    const el = $(id);
    if(!el) return;
    const out = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    if('value' in el && !['PRE','DIV','SECTION'].includes(el.tagName)) el.value = out;
    else el.textContent = out;
  }
  function appendLog(id, data){
    const el = $(id);
    if(!el) return;
    const out = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    const prev = ('value' in el && !['PRE','DIV','SECTION'].includes(el.tagName)) ? el.value : el.textContent;
    const next = (prev ? prev + '\n' : '') + out;
    if('value' in el && !['PRE','DIV','SECTION'].includes(el.tagName)) el.value = next;
    else el.textContent = next;
  }
  function badge(text, cls){
    const b = $('diagModeBadge');
    if(!b) return;
    b.textContent = text;
    b.className = 'badge' + (cls ? ' ' + cls : '');
  }
  function now(){ return new Date().toISOString(); }
  function cssPath(el){
    if(!el || !el.nodeType || el.nodeType !== 1) return '';
    const path = [];
    let cur = el;
    while(cur && cur.nodeType === 1 && path.length < 8){
      let part = cur.tagName.toLowerCase();
      if(cur.id){ part += '#' + cur.id; path.unshift(part); break; }
      if(cur.className && typeof cur.className === 'string'){
        const c = cur.className.trim().split(/\s+/).slice(0,2).join('.');
        if(c) part += '.' + c;
      }
      const parent = cur.parentElement;
      if(parent){
        const same = Array.from(parent.children).filter(x => x.tagName === cur.tagName);
        if(same.length > 1) part += ':nth-of-type(' + (same.indexOf(cur)+1) + ')';
      }
      path.unshift(part);
      cur = parent;
    }
    return path.join(' > ');
  }
  function parentBlockPath(el){
    const block = el && el.closest ? el.closest('.left,.middle,.right,.field,.logpanel,.Section1,table,tbody,tr,td,div') : null;
    return cssPath(block || el);
  }
  function contextText(el){
    const raw = ((el && (el.innerText || el.textContent || el.value)) || '').replace(/\s+/g,' ').trim();
    return raw.slice(0, 240);
  }
  function sourceOf(el, doc){
    if(doc !== document) return 'right_iframe';
    if(el.closest && el.closest('.left')) return 'left';
    if(el.closest && el.closest('.middle')) return 'middle';
    if(el.closest && el.closest('.right')) return 'right_outer';
    return 'outside';
  }
  function areaName(el, source){
    if(source === 'left') return '?쇱そ 硫붾돱';
    if(source === 'middle') return '媛?대뜲 9移?;
    if(source === 'right_iframe') return '?ㅻⅨ履??덈궡??iframe ?대?';
    return '吏꾨떒 ?쒖쇅 ?곸뿭';
  }
  const RIGHT_TO_MID = {
    guideTitleEn:'midTitleEn', guideTitleKo:'midTitleKo', guidePub:'bookPub',
    guideDate:'bookDate', guidePage:'bookPage', guideListPrice:'bookListPrice',
    guideSupplyPrice:'bookSupplyPrice', guideLinkAnchor:'midLink', guideLinkText:'midLink',
    guideTocLeft:'midToc', guideTocAuxSlot:'midToc'
  };
  function mappedRightTarget(el, e){
    if(!el || !el.closest) return null;
    const direct = el.closest('#guideTitleEn,#guideTitleKo,#guidePub,#guideDate,#guidePage,#guideListPrice,#guideSupplyPrice,#guideLinkAnchor,#guideLinkText,#guideTocLeft,#guideTocAuxSlot');
    if(direct) return direct;
    const line1 = el.closest('#guideBookLine1');
    const line2 = el.closest('#guideBookLine2');
    const line = line1 || line2;
    if(line){
      const rect = line.getBoundingClientRect();
      const rel = rect.width ? ((e.clientX - rect.left) / rect.width) : 0;
      let id = '';
      if(line1) id = rel < 0.44 ? 'guidePub' : (rel < 0.72 ? 'guidePage' : 'guideListPrice');
      if(line2) id = rel < 0.44 ? 'guideDate' : (rel < 0.72 ? 'guidePdf' : 'guideSupplyPrice');
      return id ? (line.ownerDocument.getElementById(id) || line) : line;
    }
    const linkBlock = el.closest('a,#guideLinkAnchor,#guideLinkText');
    if(linkBlock){
      return el.ownerDocument.getElementById('guideLinkText') || el.ownerDocument.getElementById('guideLinkAnchor') || linkBlock;
    }
    return null;
  }
  function makeTrace(e, sourceDoc){
    let el = e.target;
    const source = sourceOf(el, sourceDoc);
    if(source === 'right_iframe'){
      const mapped = mappedRightTarget(el, e);
      if(mapped) el = mapped;
    }
    const areaId = el.id || (el.getAttribute && (el.getAttribute('data-area-id') || el.getAttribute('name'))) || el.tagName.toLowerCase();
    return {
      status: source === 'outside' || source === 'right_outer' ? 'OUT_OF_SCOPE' : 'LOCKED',
      area_id: areaId,
      area_name_ko: areaName(el, source),
      selector: el.id ? ('#' + el.id) : cssPath(el),
      dom_path: cssPath(el),
      parent_block_path: parentBlockPath(el),
      clicked_text: contextText(el),
      context_window: contextText(el.parentElement || el),
      x: e.clientX,
      y: e.clientY,
      source: source,
      mapped_mid_id: RIGHT_TO_MID[areaId] || '',
      generated_at: now()
    };
  }
  function handleAreaClick(e, sourceDoc){
    if(!STORE.coordMode) return;
    const trace = makeTrace(e, sourceDoc);
    if(trace.source === 'outside' || trace.source === 'right_outer') return;
    e.preventDefault();
    e.stopPropagation();
    if(!STORE.clickedTrace){
      STORE.clickedTrace = trace;
      write('clickedTraceView', trace);
      write('autoLog', {at:now(), event:'COORD_CLICK_LOCKED', clicked_trace: trace});
      write('coreLog', {at:now(), event:'CLICKED_TRACE_FIXED', area_id: trace.area_id, source: trace.source, selector: trace.selector});
      badge('醫뚰몴 怨좎젙: ' + trace.area_name_ko, 'ok');
      try{ e.target.classList.add('coord-hit'); setTimeout(()=>e.target.classList.remove('coord-hit'),900); }catch(_){}
    } else {
      badge('醫뚰몴 ?대? 怨좎젙?? 由ъ뀑 ????뼱?곌린 李⑤떒', 'warn');
    }
    STORE.coordMode = false;
  }
  function attachClickListeners(){
    document.addEventListener('click', function(e){ handleAreaClick(e, document); }, true);
    const frame = $('rightFrame');
    function bindFrame(){
      const doc = frame && frame['content'+'Document'];
      if(!doc || doc.__singlePathClickBound) return;
      doc.__singlePathClickBound = true;
      doc.addEventListener('click', function(e){ handleAreaClick(e, doc); }, true);
      startMutationObserver();
    }
