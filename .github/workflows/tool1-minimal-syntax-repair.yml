name: Tool1 minimal syntax repair

on:
  push:
    paths:
      - '.github/workflows/tool1-minimal-syntax-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch only confirmed corruption coordinates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s
          old1="    if(/chapter\\s*\\d|\n    if(/publisher|발행사/i.test(txt))"
          new1="    if(/chapter\\s*\\d|목차/i.test(txt)) return {id:'preview-toc-anchor', name:'원본 목차 앵커(임시)'};\n    if(/publisher|발행사/i.test(txt))"
          if old1 not in s: raise SystemExit('confirmed corruption #1 not found')
          s=s.replace(old1,new1,1)
          old2="    if(/chapter\\s*\\d|\n      const toc = tagged.find"
          new2="    if(/chapter\\s*\\d|목차/i.test(textAtPoint)){\n      const toc = tagged.find"
          if old2 not in s: raise SystemExit('confirmed corruption #2 not found')
          s=s.replace(old2,new2,1)
          pattern=re.compile(r"\n  \};\n    const areaSize = \(node\)=>\{.*?\n    return null;\n  \}\n  function buildTrace", re.S)
          s,n=pattern.subn("\n  }\n  function buildTrace",s,count=1)
          if n != 1: raise SystemExit(f'confirmed orphan duplicate block match count={n}')
          if s==original: raise SystemExit('no changes')
          p.write_text(s,encoding='utf-8')
          print('minimal confirmed corruption patch applied')
          PY
      - name: Patch exact remaining parse failures from captured artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def once(old,new,label):
              global s
              n=s.count(old)
              if n != 1: raise SystemExit(f'{label} match count={n}')
              s=s.replace(old,new,1)
              print('patched',label)
          once("      const chapterNodes = [...doc.querySelectorAll('p,td,div,span')].filter(el => /chapter\\s*\\d|\\d+\\.\\d+|\n      tocBody = chapterNodes[0] || tocHeader;", "      const chapterNodes = [...doc.querySelectorAll('p,td,div,span')].filter(el => /chapter\\s*\\d|\\d+\\.\\d+|목차/i.test(getText(el)));\n      tocBody = chapterNodes[0] || tocHeader;", 'script001-chapterNodes')
          once("      tocBody = pickBest(doc,'p,td,div,span',[[/chapter\\s*\\d|\\d+\\.\\d+/i,12],[/\n    }", "      tocBody = pickBest(doc,'p,td,div,span',[[/chapter\\s*\\d|\\d+\\.\\d+/i,12],[/table of contents|contents|목차/i,10]]);\n    }", 'script001-tocBody')
          once("      'preview-toc-anchor':()=> pickBest(doc,'p,td,div,span',[[/chapter\\s*\\d|\\d+\\.\\d+/i,12],[/\n      'preview-book-anchor'", "      'preview-toc-anchor':()=> pickBest(doc,'p,td,div,span',[[/chapter\\s*\\d|\\d+\\.\\d+/i,12],[/table of contents|contents|목차/i,10]]),\n      'preview-book-anchor'", 'script001-anchor-map')
          once("traceStep('STEP4', '중단: rightFrame['content'+'Document'] 없음')", "traceStep('STEP4', '중단: rightFrame contentDocument 없음')", 'script002-string')
          once("throw new Error('rightFrame['content'+'Document'] 없음')", "throw new Error('rightFrame contentDocument 없음')", 'script002-throw-string')
          once("    return ['\n  }\n  function sampleToc(ko){", "    return ['Industry','산업','industry'];\n  }\n  function sampleToc(ko){", 'script008-fallback')
          once("'P5/P6: 보류'].join('\n');", "'P5/P6: 보류'].join('\\n');", 'script010-join')
          once("return Object.assign({publisher:pub},map[pub]||map.);", "return Object.assign({publisher:pub},map[pub]||map['']);", 'script012-map-fallback')
          once("    if(/ai|인공지능|gpu|서버|데이터센터/.test(raw)) return ['\n    if(/반도체|semiconductor|칩/.test(raw))", "    if(/ai|인공지능|gpu|서버|데이터센터/.test(raw)) return ['AI Infrastructure','AI·GPU·데이터센터','ai-infrastructure'];\n    if(/반도체|semiconductor|칩/.test(raw))", 'script015-ai-fallback')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Parse-check every inline script and persist exact failures
        id: parsecheck
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/scripts').mkdir(exist_ok=True)
          for i,script in enumerate(scripts,1): Path(f'/tmp/scripts/script-{i:03d}.js').write_text(script,encoding='utf-8')
          print('inline_scripts',len(scripts))
          PY
          : > /tmp/parse-report.txt
          failed=0
          for f in /tmp/scripts/*.js; do
            if ! node --check "$f" >> /tmp/parse-report.txt 2>&1; then
              echo "PARSE_FAIL=$f" | tee -a /tmp/parse-report.txt
              failed=1
            fi
          done
          cat /tmp/parse-report.txt
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Upload exact parse failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool001-parse-failure-evidence
          path: |
            /tmp/parse-report.txt
            /tmp/scripts/*.js
          if-no-files-found: error
          retention-days: 14
      - name: Enforce zero parse failures
        run: |
          test "${{ steps.parsecheck.outputs.failed }}" -eq 0
      - name: Commit minimal repair
        run: |
          git config user.name 'wic-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: isolate confirmed Tool001 syntax corruption'
          git push
